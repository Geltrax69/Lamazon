name: Ship update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    # The Flutter app lives in frontend/ since the repo gained a Go backend.
    defaults:
      run:
        working-directory: frontend
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - uses: shorebirdtech/setup-shorebird@v1
      # ponytail: patch the current release; if none exists for this version
      # (first run / version bump), create a full release instead.
      # --no-tree-shake-icons ships the full icon fonts so adding new icons
      # stays patchable. If a patch fails on OTHER asset changes (new bundled
      # images/fonts), bump version in pubspec.yaml to force a fresh release.
      - name: Patch or release
        run: |
          shorebird patch android -- --no-tree-shake-icons \
            || shorebird release android --artifact apk -- --no-tree-shake-icons
      # On release runs an APK is produced; keep the README download link fresh.
      # On patch runs nothing matches — old APK stays valid and self-patches on launch.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: 'Auto-built from ${{ github.sha }}'
          files: frontend/build/app/outputs/flutter-apk/app-release.apk
