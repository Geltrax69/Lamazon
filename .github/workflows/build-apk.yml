name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      # Rolling "latest" release: same tag every push, APK asset replaced.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: 'Auto-built from ${{ github.sha }}'
          files: build/app/outputs/flutter-apk/app-release.apk
