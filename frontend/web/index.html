<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Declared here on purpose. With no viewport meta of its own, the Flutter
    web engine injects one carrying maximum-scale=1.0 and user-scalable=no,
    which blocks pinch-zoom and fails WCAG 1.4.4. Low-vision users need to be
    able to zoom a shop.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Campus shopping and delivery. Order from stores around you and have it brought to your block in minutes.">
  <meta name="theme-color" content="#143E32">
  <style>
    :root {
      --text: #17221D;
      --muted: #66716A;
      --strong: #1D4939;
      --track: #E1E5DD;
      --canvas: #F7F6F0;
      --surface: #FFFDF8;
      --forest: #143E32;
      --lime: #C6EE63;
    }
    html, body { background: var(--canvas); }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lamazon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lamazon</title>
  <link rel="manifest" href="manifest.json">
  <script src="firebase-env.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      getMessaging,
      getToken,
      isSupported,
      onMessage,
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js';

    // FIXME(ops): this fallback points at Firebase project `messages-34023`,
    // which is not this product's project. Web API keys are not secret, but a
    // default aimed at an unrelated project means push silently registers
    // against the wrong place when the deploy forgets to set
    // window.lamazonFirebaseConfig. Set that on every environment and delete
    // the fallback, or replace these values with Lamazon's own project.
    const firebaseConfig = window.lamazonFirebaseConfig || {
      apiKey: 'AIzaSyBGvYciGBw1hGyAiOE2OjOEbeiuonkfsvk',
      authDomain: 'messages-34023.firebaseapp.com',
      projectId: 'messages-34023',
      storageBucket: 'messages-34023.firebasestorage.app',
      messagingSenderId: '712322562286',
      appId: '1:712322562286:web:cbbb820967ae46611b1bff',
    };

    if (!window.lamazonFirebaseConfig) {
      console.warn(
        'Lamazon: using the built-in Firebase fallback config. ' +
        'Set window.lamazonFirebaseConfig for this environment.',
      );
    }

    const app = initializeApp(firebaseConfig);
    let messagingPromise;
    let foregroundHandlerReady = false;

    window.lamazonFirebaseMessagingToken = async (vapidKey) => {
      if (!(await isSupported())) return '';
      if (Notification.permission !== 'granted') return '';
      if (!vapidKey) {
        throw new Error('FIREBASE_WEB_PUSH_PUBLIC_KEY is not configured');
      }

      messagingPromise ??= Promise.resolve(getMessaging(app));
      const messaging = await messagingPromise;
      const registration = await navigator.serviceWorker.register('/push/sw.js', {
        scope: '/push/',
      });
      await waitForActiveServiceWorker(registration);
      const options = { serviceWorkerRegistration: registration };
      options.vapidKey = vapidKey;

      if (!foregroundHandlerReady) {
        foregroundHandlerReady = true;
        onMessage(messaging, (payload) => {
          console.info('[Lamazon push] foreground FCM payload', payload);
          const data = payload?.data || {};
          const notification = payload?.notification || {};
          const title = data.title || notification.title || 'Lamazon';
          const body = data.body || notification.body || '';
          const confirm = data.confirm === 'true' || data.confirm === true;
          if (title || body) {
            registration.showNotification(title, {
              body,
              icon: '/icons/Icon-192.png',
              badge: '/icons/Icon-192.png',
              tag: data.tag || 'lamazon',
              data: { url: data.url || '/', confirm },
              actions: confirm
                ? [{ action: 'confirm', title: 'Yes, got it' }]
                : [],
              requireInteraction: confirm,
            }).catch((error) => {
              console.error('[Lamazon push] showNotification failed', error);
              if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body, icon: '/icons/Icon-192.png' });
              }
            });
          }
        });
      }

      return getToken(messaging, options);
    };

    async function waitForActiveServiceWorker(registration) {
      if (registration.active) return;
      const worker = registration.installing || registration.waiting;
      if (!worker) {
        await navigator.serviceWorker.ready;
        return;
      }
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(
          () => reject(new Error('Firebase service worker did not activate')),
          10000,
        );
        worker.addEventListener('statechange', () => {
          if (worker.state === 'activated') {
            clearTimeout(timeout);
            resolve();
          }
        });
      });
    }
  </script>
</head>
<body>
  <script>
    window.downloadLamazonCSV = (name, contents) => {
      const url = URL.createObjectURL(new Blob(['\ufeff', contents], {type: 'text/csv;charset=utf-8'}));
      const link = document.createElement('a'); link.href = url; link.download = name;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
