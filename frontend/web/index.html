<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lamazon">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>lamazon</title>
  <link rel="manifest" href="manifest.json">
  <script src="firebase-env.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      getMessaging,
      getToken,
      isSupported,
      onMessage,
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js';

    const firebaseConfig = window.lamazonFirebaseConfig || {
      apiKey: 'AIzaSyBGvYciGBw1hGyAiOE2OjOEbeiuonkfsvk',
      authDomain: 'messages-34023.firebaseapp.com',
      projectId: 'messages-34023',
      storageBucket: 'messages-34023.firebasestorage.app',
      messagingSenderId: '712322562286',
      appId: '1:712322562286:web:cbbb820967ae46611b1bff',
    };

    const app = initializeApp(firebaseConfig);
    let messagingPromise;
    let foregroundHandlerReady = false;

    window.lamazonFirebaseMessagingToken = async (vapidKey) => {
      if (!(await isSupported())) return '';
      if (Notification.permission !== 'granted') return '';
      if (!vapidKey) {
        throw new Error('FIREBASE_WEB_PUSH_PUBLIC_KEY is not configured');
      }

      messagingPromise ??= Promise.resolve(getMessaging(app));
      const messaging = await messagingPromise;
      const registration = await navigator.serviceWorker.register('/push/sw.js', {
        scope: '/push/',
      });
      await waitForActiveServiceWorker(registration);
      const options = { serviceWorkerRegistration: registration };
      options.vapidKey = vapidKey;

      if (!foregroundHandlerReady) {
        foregroundHandlerReady = true;
        onMessage(messaging, (payload) => {
          console.info('[Lamazon push] foreground FCM payload', payload);
          const data = payload?.data || {};
          const notification = payload?.notification || {};
          const title = data.title || notification.title || 'Lamazon';
          const body = data.body || notification.body || '';
          const confirm = data.confirm === 'true' || data.confirm === true;
          if (title || body) {
            registration.showNotification(title, {
              body,
              icon: '/icons/Icon-192.png',
              badge: '/icons/Icon-192.png',
              tag: data.tag || 'lamazon',
              data: { url: data.url || '/', confirm },
              actions: confirm
                ? [{ action: 'confirm', title: 'Yes, got it' }]
                : [],
              requireInteraction: confirm,
            }).catch((error) => {
              console.error('[Lamazon push] showNotification failed', error);
              if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body, icon: '/icons/Icon-192.png' });
              }
            });
          }
        });
      }

      return getToken(messaging, options);
    };

    async function waitForActiveServiceWorker(registration) {
      if (registration.active) return;
      const worker = registration.installing || registration.waiting;
      if (!worker) {
        await navigator.serviceWorker.ready;
        return;
      }
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(
          () => reject(new Error('Firebase service worker did not activate')),
          10000,
        );
        worker.addEventListener('statechange', () => {
          if (worker.state === 'activated') {
            clearTimeout(timeout);
            resolve();
          }
        });
      });
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
